<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de contactos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-..." crossorigin="anonymous">
</head>

<body>
<div class="container mt-4">
    <h1 class="mb-4">Contactos</h1>

    <!-- Search form -->
    <form method="get" class="row g-3 mb-3">
        <div class="col-auto">
            <input type="text" name="q" value="{{ q }}" class="form-control" placeholder="Buscar por nombre o correo">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary mb-3">Buscar</button>
        </div>
    </form>

    <!-- Add contact form -->
    <form method="post" class="row g-3">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <div class="col-12">
            <button type="submit" class="btn btn-success">Agregar contacto</button>
        </div>
    </form>

    <!-- Contacts list -->
    <table class="table table-striped mt-4">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Dirección</th>
            </tr>
        </thead>
        <tbody>
            {% for contacto in contactos %}
                <tr>
                    <td>{{ contacto.nombre }}</td>
                    <td>{{ contacto.telefono }}</td>
                    <td>{{ contacto.correo }}</td>
                    <td>{{ contacto.direccion }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="4" class="text-center">No hay contactos.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-..." crossorigin="anonymous"></script>
</body>

</html>
